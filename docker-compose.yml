services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rulebound
      POSTGRES_PASSWORD: rulebound
      POSTGRES_DB: rulebound
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rulebound"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      RULEBOUND_DATABASE_URL: postgresql+asyncpg://rulebound:rulebound@db:5432/rulebound
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
